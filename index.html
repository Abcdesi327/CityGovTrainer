<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CityGovTrainer</title>

<!--
  The site root exists so GitHub Pages has something to serve at
  https://<user>.github.io/CityGovTrainer/ — the app itself lives in /app/,
  one level down, because it loads content from the sibling directories
  (taxonomy/, quiz-data/, case-studies/) that must stay at the root.

  The paths below are relative, so this works at a project-site subpath, at a
  domain root, and from a local `python3 -m http.server` alike.
-->
<link rel="canonical" href="app/">
<meta http-equiv="refresh" content="0; url=app/">
<script>
  // Runs before the meta refresh; replace() keeps the 404-ish root out of history.
  location.replace('app/' + location.search + location.hash);
</script>

<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f6f5f1; color: #1a1d21; text-align: center; padding: 2rem;
  }
  a { color: #1f4b73; }
  @media (prefers-color-scheme: dark) {
    body { background: #14171a; color: #e8e8e4; }
    a { color: #7fb1dd; }
  }
</style>
</head>
<body>
  <p>Opening the quiz runner… If nothing happens, <a href="app/">continue to the app</a>.</p>
</body>
</html>
